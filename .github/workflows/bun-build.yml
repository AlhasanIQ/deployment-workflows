name: reusable Bun build

on:
  workflow_call:
    inputs:
      bun_version:
        description: Bun toolchain version
        required: true
        type: string
      install_command:
        description: Locked dependency installation command
        required: false
        default: bun install --frozen-lockfile
        type: string
      test_command:
        description: Test command
        required: false
        default: bun run test
        type: string
      lint_command:
        description: Optional lint command
        required: false
        default: ""
        type: string
      build_command:
        description: Build and package command
        required: true
        type: string
      artifact_name:
        description: Uploaded artifact name
        required: true
        type: string
      artifact_path:
        description: Newline-separated paths to upload
        required: true
        type: string
      retention_days:
        description: Artifact retention in days
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Install exact dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Test
        if: inputs.test_command != ''
        run: ${{ inputs.test_command }}

      - name: Lint
        if: inputs.lint_command != ''
        run: ${{ inputs.lint_command }}

      - name: Build artifact
        run: ${{ inputs.build_command }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
